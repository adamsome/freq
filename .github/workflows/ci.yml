name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Don't install git hooks on the runner.
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Runs `next typegen` first, since next-env.d.ts is gitignored.
      - run: npm run type-check

      - run: npm run lint

      - run: npm run format:check

      # No env vars needed: Mongo and Auth0 config is only read at request time.
      - run: npm run build
